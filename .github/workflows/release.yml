name: Release Workflow

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build module ZIP
        run: |
          chmod +x build.sh
          ./build.sh "$GITHUB_REF_NAME"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mod_id="$(sed -n 's/^id=//p' module.prop | head -n 1)"
          gh release upload "$GITHUB_REF_NAME" "$mod_id-$GITHUB_REF_NAME.zip" --clobber

name: Release Workflow

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and replace
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and publish module ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$RELEASE_TAG"
          fi

          chmod +x build.sh
          ./build.sh "$version"

          mod_id="$(sed -n 's/^id=//p' module.prop | head -n 1)"
          asset="$mod_id-$version.zip"
          old_asset="systemless-degoogler-microg-v1.0.zip"

          if gh release view "$version" --json assets --jq '.assets[].name' | grep -Fxq "$old_asset"; then
            gh release delete-asset "$version" "$old_asset" --yes
          fi
          gh release upload "$version" "$asset" --clobber

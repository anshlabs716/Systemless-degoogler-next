name: Release Workflow

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and replace
        required: true
        default: v1.0.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and publish module ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$RELEASE_TAG"
          fi

          chmod +x build.sh
          ./build.sh "$version"

          mod_id="$(sed -n 's/^id=//p' module.prop | head -n 1)"
          asset="$mod_id-$version.zip"
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --title "$version" --notes "Systemless DeGoogler $version"
          fi

          gh release upload "$version" "$asset" --clobber

          # Remove superseded ZIP assets from prior releases while preserving
          # their release notes and source archives.
          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            [ "$old_tag" = "$version" ] && continue
            while IFS= read -r old_asset; do
              case "$old_asset" in *.zip) gh release delete-asset "$old_tag" "$old_asset" --yes || true ;; esac
            done < <(gh release view "$old_tag" --json assets --jq '.assets[].name')
          done < <(gh release list --json tagName --jq '.[].tagName')
